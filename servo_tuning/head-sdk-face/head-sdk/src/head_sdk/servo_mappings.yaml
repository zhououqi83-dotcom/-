jawFrontLeft: # 0.99 0到1由开到闭
  jawOpen: [1, [0, 1], [1, 0]]

jawFrontRight: # 0.99 0到1由开到闭
  jawOpen: [1, [0, 1], [1, 0]]

jawBackLeft: #0.5 0到1由前到后
  jawForward:  [1, [0, 1], [0.5,0]]  # 0.5 0
  jawLeft:     [1, [0, 1], [0, 0.5]] # 0.5 1

jawBackRight: #0.5 0到1由前到后
  jawForward:   [1, [0, 1], [0.5,0]]  # 0.5 0
  jawRight:     [1, [0, 1], [0, 0.5]] # 0.5 1

