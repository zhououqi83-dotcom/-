# 格式：舵机名字 → {blendshape系数：[blendshape系数, [blendshape范围], [舵机范围]]}
# 实现：舵机名字 = blendshape系数*map_range(当前blendshape系数, blendshape范围, 舵机范围)

left_blink: # 0.44 0到1逐渐闭眼
  eyeBlinkLeft: [1, [0, 1], [0, 0.56]] # 实际值范围 [0.44-1]
  eyeWideLeft:  [1, [0, 1], [0.44, 0]] # 实际值范围 [0.44-0]

right_blink: # 0.44 0到1逐渐闭眼
  eyeBlinkRight: [1, [0, 1], [0, 0.56]] # 实际值范围 [0.44-1]
  eyeWideRight:  [1, [0, 1], [0.44, 0]] # 实际值范围 [0.44-0]

left_eye_level: # 0.5 0到0.5中心向右边 0.5到1中心向左边（外边）
  eyeLookOutLeft: [1, [0, 1], [0, 0.5]] # 实际值范围 0.5 - 1
  eyeLookInLeft:  [1, [0, 1], [0.5, 0]] # 实际值范围 0.5 - 0

right_eye_level: # 0.5 0到0.5中心向右边 0.5到1中心向左边（里边
  eyeLookOutRight: [1, [0, 1], [0.5, 0]] # 实际值范围 0.5 - 0
  eyeLookInRight:  [1, [0, 1], [0, 0.5]] # 实际值范围 0.5 - 1

left_eye_erect:  # 0.5 0到1眼球由上到下
  eyeLookDownLeft: [1, [0, 1], [0, 0.5]] # 实际值范围 0.5 - 1
  eyeLookUpLeft:   [1, [0, 1], [0.5, 0]] # 实际值范围 0.5 - 0

right_eye_erect: # 0.5 0到1眼球由上到下
  eyeLookDownRight : [1, [0, 1], [0, 0.5]] # 实际值范围 0.5 - 1
  eyeLookUpRight:   [1, [0, 1], [0.5, 0]] # 实际值范围 0.5 - 0

left_eyebrow_erect: #0 0到1眉毛由下到上
  browInnerUp: [1, [0, 1], [0, 1]] 

right_eyebrow_erect: #0 0到1眉毛由下到上
  browInnerUp: [1, [0, 1], [0, 1]] 

left_eyebrow_level:  #0 0到1眉毛由外向内
  browDownLeft: [1, [0, 1], [0, 1]]

right_eyebrow_level:  #0 0到1眉毛由外向内
  browDownRight: [1, [0, 1], [0, 1]]

# 颈部归一化后blendshape值的线性组合 → 舵机值
head_bai:  #0.5 0到1从右到左
  headRoll: [1, [-1, 1], [1, 0]]

head_dian: #0.5 0到1从下到上
  headPitch: [1, [-0.5, 0.5], [1, 0]] 

head_yao: #0.5 0到1从右到左
  headYaw: [1, [-1, 1], [0, 1]]

