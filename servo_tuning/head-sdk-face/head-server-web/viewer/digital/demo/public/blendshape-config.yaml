# Canonical 61-coefficient transport definition.
# Viewer sliders follow this order.
# `targets` map canonical coefficients to TalkingHead avatar morph keys.
# `positiveTargets` / `negativeTargets` split signed values into one-sided morph targets.

coefficients:
