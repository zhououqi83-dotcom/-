<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotionEngine Remote Viewer</title>
  <meta http-equiv="refresh" content="0; url=./remote.html" />
  <style>
    :root {
      color-scheme: dark;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      background: #0b1220;
      color: #e5eefc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(71, 126, 255, 0.18), transparent 45%),
        linear-gradient(180deg, #0f172a 0%, #09111d 100%);
    }

    main {
      width: min(560px, calc(100vw - 32px));
      padding: 32px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      margin: 0 0 12px;
      line-height: 1.7;
      color: #cbd5e1;
    }

    a {
      color: #7dd3fc;
    }
  </style>
</head>

<body>
  <main>
    <h1>Remote Viewer Only</h1>
    <p>该工程已整理为轻量化数字人仿真平台，入口统一收敛到 <a href="./remote.html">remote.html</a>。</p>
    <p>如果浏览器没有自动跳转，请手动打开上面的链接。</p>
  </main>
</body>

</html>
